# Experiment configuration summary for the paper reproduction package
project: slm-mcq-selective-prediction
scope: answerable MCQ selective prediction under forced-choice scoring
models:
  sub_2b:
    - Qwen2.5-0.5B-Instruct
    - Qwen2.5-1.5B-Instruct
    - TinyLlama-1.1B-Chat
  scaling_7b_9b:
    - Qwen2.5-7B-Instruct
    - Mistral-7B-Instruct-v0.3
    - Falcon3-7B
    - OLMo2-7B
    - DeepSeek-R1-Distill-Qwen-7B
    - google/gemma-2-9b-it
    - meta-llama/Llama-3.1-8B-Instruct
datasets:
  main:
    - ARC-Challenge
    - ARC-Easy
    - OpenBookQA
    - CommonsenseQA
    - BoolQ
    - HellaSwag
    - MMLU
  scaling:
    - ARC-Challenge
    - CommonsenseQA
    - HellaSwag
    - MMLU
signals:
  - confidence_option_scores
  - hidden_state_summaries
  - pca_hidden_embeddings
  - confidence_plus_pca_hidden
  - supervised_contrastive_hidden_probe
  - five_sample_generation_diagnostic
metrics:
  - AUROC
  - AUPRC
  - Risk@80% coverage
  - Risk@60% coverage
  - Risk@40% coverage
  - AURC
  - E-AURC
  - failure_capture_at_20pct_abstention
  - latency_ms
  - peak_vram_gb
random_seeds: [0, 1, 2, 3, 4]
notes:
  - Model weights are not redistributed.
  - Gemma and Llama require accepted Hugging Face gated-model access and a read token.
  - Large raw hidden-state files are intended for Zenodo/release assets, not standard GitHub storage.
